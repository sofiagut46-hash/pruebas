<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rhythm Game - Neon Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080811;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Fondo animado estilo Synthwave Grid */
    .background-grid {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image: 
        linear-gradient(to right, rgba(255, 0, 128, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.1) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 4s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(60px); }
    }

    .game-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-ui {
      display: flex;
      justify-content: space-between;
      width: 360px;
      margin-bottom: 15px;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
    }

    /* Pista de juego más grande */
    .track-container {
      position: relative;
      width: 360px;
      height: 600px;
      background: rgba(15, 15, 30, 0.85);
      border: 3px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
    }

    .lane {
      flex: 1;
      border-right: 1px dashed rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .lane:last-child {
      border-right: none;
    }

    /* Receptor inferior (Target) más grande y vistoso */
    .target-zone {
      position: absolute;
      bottom: 30px;
      width: 70px;
      height: 70px;
      left: 50%;
      transform: translateX(-50%);
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      transition: background 0.1s, transform 0.05s;
    }

    .target-zone.active {
      transform: translateX(-50%) scale(0.92);
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }

    /* Notas más grandes y redondeadas */
    .note {
      position: absolute;
      width: 70px;
      height: 35px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 8px;
      box-shadow: 0 0 15px currentColor;
    }

    .lane-0 .target-zone { border-color: #ff007f; color: #ff007f; }
    .lane-1 .target-zone { border-color: #00f0ff; color: #00f0ff; }
    .lane-2 .target-zone { border-color: #00ff66; color: #00ff66; }
    .lane-3 .target-zone { border-color: #ffdd00; color: #ffdd00; }

    .lane-0 .note { background: #ff007f; color: #ff007f; }
    .lane-1 .note { background: #00f0ff; color: #00f0ff; }
    .lane-2 .note { background: #00ff66; color: #00ff66; }
    .lane-3 .note { background: #ffdd00; color: #ffdd00; }

    /* Partículas de impacto */
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      animation: pop 0.4s ease-out forwards;
    }

    @keyframes pop {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }

    /* Pantalla de inicio */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 8, 17, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      border-radius: 12px;
    }

    .start-btn {
      padding: 15px 35px;
      font-size: 20px;
      font-weight: bold;
      color: #080811;
      background: #00f0ff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px #00f0ff;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px #00f0ff;
    }
  </style>
</head>
<body>

  <div class="background-grid"></div>

  <div class="game-container">
    <div class="header-ui">
      <div>SCORE: <span id="score">0</span></div>
      <div>COMBO: <span id="combo">0</span></div>
    </div>

    <div class="track-container" id="track">
      <div class="overlay" id="startScreen">
        <button class="start-btn" id="startBtn">INICIAR JUEGO</button>
      </div>

      <div class="lane lane-0"><div class="target-zone" id="target-0">A</div></div>
      <div class="lane lane-1"><div class="target-zone" id="target-1">S</div></div>
      <div class="lane lane-2"><div class="target-zone" id="target-2">K</div></div>
      <div class="lane lane-3"><div class="target-zone" id="target-3">L</div></div>
    </div>
  </div>

  <script>
    const keys = ['a', 's', 'k', 'l'];
    const laneKeys = { 'a': 0, 's': 1, 'k': 2, 'l': 3 };
    const trackHeight = 600;
    const targetY = 535; // Posición de impacto
    const noteSpeed = 0.5; // Píxeles por milisegundo

    let audioCtx = null;
    let isPlaying = false;
    let score = 0;
    let combo = 0;
    let startTime = 0;
    let notes = [];

    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const track = document.getElementById('track');

    // Inicializar AudioContext sin latencia inicial
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Generador de audio sintético (Sintetizador en ritmo)
    function playNoteSound(freq) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // Generar patrón de notas con separación garantizada al ritmo (BPM)
    function generateRhythmChart() {
      const bpm = 125;
      const beatInterval = (60 / bpm) * 1000;
      const chart = [];
      const totalBeats = 120; // Duración total
      
      let lastTimePerLane = [-999, -999, -999, -999];
      const minDistanceTime = 250; // Evita notas demasiado juntas en la misma línea

      for (let i = 0; i < totalBeats; i++) {
        const time = i * beatInterval;
        const lane = Math.floor(Math.random() * 4);

        if (time - lastTimePerLane[lane] >= minDistanceTime) {
          chart.push({ lane, time });
          lastTimePerLane[lane] = time;
        }

        // Posibilidad de nota doble en el compás sin superposición
        if (i % 2 === 0 && Math.random() > 0.5) {
          const secondLane = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
          if (time - lastTimePerLane[secondLane] >= minDistanceTime) {
            chart.push({ lane: secondLane, time });
            lastTimePerLane[secondLane] = time;
          }
        }
      }
      return chart;
    }

    function startGame() {
      initAudio();
      startScreen.style.display = 'none';
      score = 0;
      combo = 0;
      scoreEl.innerText = score;
      comboEl.innerText = combo;

      const chart = generateRhythmChart();
      const travelTime = targetY / noteSpeed; // Tiempo que tarda la nota en bajar

      const lanesElements = [
        document.querySelector('.lane-0'),
        document.querySelector('.lane-1'),
        document.querySelector('.lane-2'),
        document.querySelector('.lane-3')
      ];

      notes = chart.map(data => {
        const el = document.createElement('div');
        el.className = 'note';
        lanesElements[data.lane].appendChild(el);

        return {
          lane: data.lane,
          targetTime: data.time + travelTime,
          el: el,
          hit: false,
          missed: false
        };
      });

      startTime = performance.now();
      isPlaying = true;
      requestAnimationFrame(updateGame);
    }

    function updateGame(now) {
      if (!isPlaying) return;

      const elapsed = now - startTime;

      notes.forEach(note => {
        if (note.hit || note.missed) return;

        // Cálculo exacto de posición por tiempo transcurrido
        const timeDiff = note.targetTime - elapsed;
        const currentY = targetY - (timeDiff * noteSpeed);

        if (currentY >= -40 && currentY <= trackHeight + 40) {
          note.el.style.transform = `translate(-50%, ${currentY}px)`;
        } else if (currentY < -40) {
          note.el.style.transform = `translate(-50%, -50px)`;
        }

        // Detección de nota perdida (Miss)
        if (timeDiff < -120 && !note.hit && !note.missed) {
          note.missed = true;
          note.el.style.opacity = '0.2';
          combo = 0;
          comboEl.innerText = combo;
        }
      });

      requestAnimationFrame(updateGame);
    }

    // Efecto visual de partículas al acertar
    function createParticles(laneIndex, color) {
      const targetZone = document.getElementById(`target-${laneIndex}`);
      const rect = targetZone.getBoundingClientRect();
      const trackRect = track.getBoundingClientRect();

      const originX = rect.left - trackRect.left + rect.width / 2;
      const originY = rect.top - trackRect.top + rect.height / 2;

      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.backgroundColor = color;
        p.style.left = `${originX}px`;
        p.style.top = `${originY}px`;

        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 40;
        p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);

        track.appendChild(p);
        setTimeout(() => p.remove(), 400);
      }
    }

    // Manejo de controles e interacción
    window.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if (!(key in laneKeys) || !isPlaying) return;

      const lane = laneKeys[key];
      const targetZone = document.getElementById(`target-${lane}`);
      targetZone.classList.add('active');

      const elapsed = performance.now() - startTime;
      const colors = ['#ff007f', '#00f0ff', '#00ff66', '#ffdd00'];
      const freqs = [261.63, 329.63, 392.00, 523.25];

      // Buscar nota más cercana dentro de la ventana de impacto
      const targetNote = notes.find(n => n.lane === lane && !n.hit && !n.missed && Math.abs(n.targetTime - elapsed) < 110);

      if (targetNote) {
        targetNote.hit = true;
        targetNote.el.remove();
        
        score += 100 + combo * 10;
        combo++;
        scoreEl.innerText = score;
        comboEl.innerText = combo;

        playNoteSound(freqs[lane]);
        createParticles(lane, colors[lane]);
      }
    });

    window.addEventListener('keyup', e => {
      const key = e.key.toLowerCase();
      if (key in laneKeys) {
        document.getElementById(`target-${laneKeys[key]}`).classList.remove('active');
      }
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
