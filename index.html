<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Monster Beat Surfer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #050508;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .glow-text {
      text-shadow: 0 0 10px rgba(236, 72, 153, 0.7), 0 0 20px rgba(168, 85, 247, 0.5);
    }
    .cyber-card {
      background: rgba(15, 15, 26, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(236, 72, 153, 0.3);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(236, 72, 153, 0.15);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #ec4899;
      border-radius: 3px;
    }
  </style>
</head>
<body class="relative select-none">

  <!-- CANVAS DE JUEGO -->
  <canvas id="gameCanvas"></canvas>

  <!-- HUD SUPERIOR (Durante el juego) -->
  <div id="hud" class="hidden absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-10">
    <div class="flex flex-col gap-1">
      <div class="text-xs uppercase tracking-widest text-pink-400 font-bold">Puntuación</div>
      <div id="scoreDisplay" class="text-4xl font-extrabold text-white glow-text">0</div>
      <div id="comboDisplay" class="text-sm font-bold text-yellow-400 opacity-0 transition-opacity">0x COMBO!</div>
    </div>

    <!-- Barra de Modo Furia -->
    <div class="w-1/3 max-w-xs flex flex-col items-center">
      <div class="text-xs text-purple-300 font-semibold mb-1 tracking-wider">MODO FURIA</div>
      <div class="w-full bg-gray-900 border border-purple-500/50 rounded-full h-3 overflow-hidden p-0.5">
        <div id="frenzyBar" class="bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 h-full w-0% rounded-full transition-all duration-200"></div>
      </div>
    </div>

    <!-- Controles HUD -->
    <div class="flex gap-2 pointer-events-auto">
      <button id="pauseBtn" class="bg-pink-600 hover:bg-pink-500 text-white p-3 rounded-xl shadow-lg transition active:scale-95 border border-pink-400/40">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>

  <!-- MENÚ PRINCIPAL -->
  <div id="mainMenu" class="absolute inset-0 flex items-center justify-center p-4 z-20 transition-all duration-500">
    <div class="cyber-card p-6 md:p-8 rounded-3xl max-w-md w-full flex flex-col gap-5">
      <div class="text-center">
        <h1 class="text-3xl md:text-4xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 glow-text">
          BEAT SURFER
        </h1>
        <p class="text-xs text-gray-400 mt-1">¡Devora notas al ritmo de cualquier canción!</p>
      </div>

      <!-- Selección de Canción -->
      <div class="flex flex-col gap-3">
        <label class="text-xs font-bold uppercase tracking-wider text-pink-400">1. Elige tu música</label>
        
        <!-- Opción YouTube -->
        <div class="relative">
          <input type="text" id="ytUrlInput" placeholder="Pega link de YouTube o ID de video" 
                 class="w-full bg-black/60 border border-purple-500/40 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 text-white placeholder-gray-500">
        </div>

        <div class="text-center text-xs text-gray-500 font-bold">- O TAMBIÉN -</div>

        <!-- Opción Archivo Local -->
        <label class="cursor-pointer bg-purple-950/40 hover:bg-purple-900/50 border border-dashed border-purple-500/50 rounded-xl p-3 text-center transition group">
          <span class="text-xs text-purple-300 group-hover:text-pink-300 font-medium block">📁 Subir MP3 / WAV local</span>
          <input type="file" id="fileInput" accept="audio/*" class="hidden">
        </label>
        
        <div id="selectedSongName" class="text-xs text-cyan-400 truncate text-center font-mono hidden"></div>
      </div>

      <!-- Selector de Dificultad -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold uppercase tracking-wider text-pink-400">2. Dificultad</label>
        <div class="grid grid-cols-3 gap-2">
          <button data-diff="easy" class="diff-btn bg-black/40 border border-gray-700 hover:border-pink-500 py-2 rounded-xl text-xs font-bold transition">FÁCIL</button>
          <button data-diff="normal" class="diff-btn bg-pink-600 border border-pink-400 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-pink-600/30">NORMAL</button>
          <button data-diff="hard" class="diff-btn bg-black/40 border border-gray-700 hover:border-pink-500 py-2 rounded-xl text-xs font-bold transition">DIFÍCIL</button>
        </div>
      </div>

      <!-- Botón Iniciar -->
      <button id="startBtn" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 text-white font-extrabold py-3.5 rounded-xl shadow-xl shadow-pink-500/25 transition active:scale-95 text-sm uppercase tracking-wider mt-2">
        ¡Cargar y Jugar!
      </button>

      <div id="statusMessage" class="text-xs text-center text-yellow-400 font-mono hidden">Cargando y procesando audio...</div>
    </div>
  </div>

  <!-- MENÚ DE PAUSA -->
  <div id="pauseMenu" class="hidden absolute inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-30">
    <div class="cyber-card p-6 rounded-3xl max-w-xs w-full flex flex-col gap-4 text-center">
      <h2 class="text-2xl font-black tracking-widest text-pink-500">PAUSA</h2>
      
      <button id="resumeBtn" class="w-full bg-pink-600 hover:bg-pink-500 py-3 rounded-xl font-bold text-sm transition">Reanudar</button>
      <button id="restartBtn" class="w-full bg-purple-800 hover:bg-purple-700 py-3 rounded-xl font-bold text-sm transition">Reiniciar</button>
      <button id="changeSongBtn" class="w-full bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-bold text-sm transition text-gray-300">Cambiar Canción / Menú</button>
    </div>
  </div>

  <script>
    // --- ESTADO Y CONFIGURACIÓN DEL JUEGO ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx, analyser, audioSource, audioBuffer, audioNode;
    let audioPlaying = false;
    let gameState = 'MENU'; // MENU, PLAYING, PAUSED
    let selectedDifficulty = 'normal';
    
    let score = 0;
    let combo = 0;
    let frenzyMeter = 0;
    let isFrenzy = false;
    let frenzyTimer = 0;

    // Configuración de carriles y perspectiva
    const LNS = [-1.8, 0, 1.8]; // Posiciones X de carriles
    let currentLane = 1; // 0: Izq, 1: Centro, 2: Der
    
    // Físicas del Monstruo
    const monster = {
      x: 0,
      y: 0,
      z: 3, // Posición Z fija en frente
      lane: 1,
      targetX: 0,
      jumpY: 0,
      vy: 0,
      isJumping: false,
      isSliding: false,
      slideTimer: 0,
      mouthOpen: 0,
      squishX: 1,
      squishY: 1,
      leanAngle: 0,
      shield: false
    };

    // Colección de notas, obstáculos y partículas
    let notes = [];
    let obstacles = [];
    let powerups = [];
    let particles = [];

    // Ajustes de dificultad
    const diffSettings = {
      easy: { speed: 18, threshold: 210, spawnRate: 350 },
      normal: { speed: 25, threshold: 180, spawnRate: 250 },
      hard: { speed: 34, threshold: 150, spawnRate: 180 }
    };

    let lastSpawnTime = 0;

    // --- RECALCULADO DE TAMAÑO DE PANTALLA ---
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- MANEJO DE AUDIO (YOUTUBE & MP3 LOCAL) ---
    const fileInput = document.getElementById('fileInput');
    const ytUrlInput = document.getElementById('ytUrlInput');
    const selectedSongName = document.getElementById('selectedSongName');
    const statusMessage = document.getElementById('statusMessage');

    let localAudioFile = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        localAudioFile = e.target.files[0];
        ytUrlInput.value = '';
        selectedSongName.innerText = "🎵 Archivo: " + localAudioFile.name;
        selectedSongName.classList.remove('hidden');
      }
    });

    ytUrlInput.addEventListener('input', () => {
      if (ytUrlInput.value.trim() !== '') {
        localAudioFile = null;
        fileInput.value = '';
        selectedSongName.classList.add('hidden');
      }
    });

    // Función para obtener URL de audio limpia de enlaces de YouTube vía proxies públicos
    async function resolveYouTubeAudioUrl(input) {
      let videoId = input.trim();
      const match = videoId.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (match) videoId = match[1];

      // Proxies con fallback
      const apiEndpoints = [
        `https://api.puredownloader.com/api/yt?id=${videoId}`,
        `https://cobalt-api.kwiatek.xyz/`
      ];

      try {
        // Intento directo con Piped / Invidious API pública
        const res = await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`);
        if (res.ok) {
          const data = await res.json();
          const audioStream = data.audioStreams.find(s => s.mimeType.includes('audio/mp4') || s.mimeType.includes('audio/webm'));
          if (audioStream) return audioStream.url;
        }
      } catch (e) {
        console.warn("Proxy 1 fallo, intentando método de audio directo...");
      }

      // Servidor fallback de respaldo de audio directo
      return `https://my-youtube-proxy.workers.dev/stream?id=${videoId}`;
    }

    async function prepareAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;

      statusMessage.classList.remove('hidden');

      if (localAudioFile) {
        statusMessage.innerText = "Procesando archivo local...";
        const arrayBuffer = await localAudioFile.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        setupAudioBufferSource();
      } else if (ytUrlInput.value.trim() !== '') {
        statusMessage.innerText = "Extrayendo audio de YouTube...";
        try {
          const streamUrl = await resolveYouTubeAudioUrl(ytUrlInput.value);
          setupAudioElementSource(streamUrl);
        } catch (err) {
          alert("No se pudo cargar el audio de YouTube. Prueba con otra canción o archivo MP3.");
          statusMessage.classList.add('hidden');
          return false;
        }
      } else {
        // Pista Synthwave automática de respaldo
        statusMessage.innerText = "Generando synthwave de fondo...";
        createSynthTrack();
      }

      statusMessage.classList.add('hidden');
      return true;
    }

    function setupAudioBufferSource() {
      if (audioNode) audioNode.stop();
      audioNode = audioCtx.createBufferSource();
      audioNode.buffer = audioBuffer;
      audioNode.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    function setupAudioElementSource(url) {
      const audio = new Audio();
      audio.crossOrigin = "anonymous";
      audio.src = url;
      audio.load();

      if (audioSource) audioSource.disconnect();
      audioSource = audioCtx.createMediaElementSource(audio);
      audioSource.connect(analyser);
      analyser.connect(audioCtx.destination);
      audioNode = audio;
    }

    function createSynthTrack() {
      // Audio autogenerado en caso de no proveer enlace
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(analyser);
      analyser.connect(audioCtx.destination);
      audioNode = osc;
    }

    // --- CONTROLES DE INTERFAZ Y SELECCIÓN DE DIFICULTAD ---
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.diff-btn').forEach(b => {
          b.className = "diff-btn bg-black/40 border border-gray-700 hover:border-pink-500 py-2 rounded-xl text-xs font-bold transition";
        });
        e.target.className = "diff-btn bg-pink-600 border border-pink-400 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-pink-600/30";
        selectedDifficulty = e.target.dataset.diff;
      });
    });

    document.getElementById('startBtn').addEventListener('click', async () => {
      const success = await prepareAudio();
      if (success) {
        document.getElementById('mainMenu').classList.add('opacity-0', 'pointer-events-none');
        document.getElementById('hud').classList.remove('hidden');
        startGame();
      }
    });

    document.getElementById('pauseBtn').addEventListener('click', pauseGame);
    document.getElementById('resumeBtn').addEventListener('click', resumeGame);
    document.getElementById('restartBtn').addEventListener('click', () => {
      resumeGame();
      startGame();
    });
    document.getElementById('changeSongBtn').addEventListener('click', () => {
      pauseGame();
      document.getElementById('pauseMenu').classList.add('hidden');
      document.getElementById('mainMenu').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('hud').classList.add('hidden');
      gameState = 'MENU';
    });

    function startGame() {
      notes = [];
      obstacles = [];
      powerups = [];
      particles = [];
      score = 0;
      combo = 0;
      frenzyMeter = 0;
      isFrenzy = false;
      monster.lane = 1;
      monster.shield = false;
      updateScoreUI();

      if (audioNode) {
        if (audioNode.start) audioNode.start(0);
        else if (audioNode.play) audioNode.play();
      }
      audioPlaying = true;
      gameState = 'PLAYING';
    }

    function pauseGame() {
      if (gameState !== 'PLAYING') return;
      gameState = 'PAUSED';
      if (audioNode && audioNode.pause) audioNode.pause();
      document.getElementById('pauseMenu').classList.remove('hidden');
    }

    function resumeGame() {
      if (gameState !== 'PAUSED') return;
      gameState = 'PLAYING';
      if (audioNode && audioNode.play) audioNode.play();
      document.getElementById('pauseMenu').classList.add('hidden');
    }

    // --- CONTROLES DE JUGABILIDAD (TECLADO Y SWIPE) ---
    window.addEventListener('keydown', (e) => {
      if (gameState !== 'PLAYING') return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') && !monster.isJumping) jump();
      if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && !monster.isSliding) slide();
    });

    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    window.addEventListener('touchend', e => {
      if (gameState !== 'PLAYING') return;
      let dx = e.changedTouches[0].clientX - touchStartX;
      let dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) moveLane(1);
        else if (dx < -30) moveLane(-1);
      } else {
        if (dy < -30 && !monster.isJumping) jump();
        else if (dy > 30 && !monster.isSliding) slide();
      }
    });

    function moveLane(dir) {
      monster.lane = Math.max(0, Math.min(2, monster.lane + dir));
      monster.leanAngle = dir * 0.25;
    }

    function jump() {
      monster.isJumping = true;
      monster.vy = -12;
      monster.squishY = 1.3;
      monster.squishX = 0.8;
    }

    function slide() {
      monster.isSliding = true;
      monster.slideTimer = 35;
      monster.squishY = 0.5;
      monster.squishX = 1.4;
    }

    // --- BUCLE PRINCIPAL Y LÓGICA DE DETECCIÓN RÍTMICA ---
    function update() {
      if (gameState === 'PLAYING') {
        const cfg = diffSettings[selectedDifficulty];

        // Detección de bajos/ritmo con Web Audio
        let bass = 0;
        if (analyser) {
          const data = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < 8; i++) sum += data[i];
          bass = sum / 8;
        }

        // Generar elementos sincronizados
        const now = Date.now();
        if (bass > cfg.threshold && now - lastSpawnTime > cfg.spawnRate) {
          spawnBeatElement();
          lastSpawnTime = now;
        }

        // Actualizar físicas del monstruo
        monster.targetX = LNS[monster.lane];
        monster.x += (monster.targetX - monster.x) * 0.2;
        monster.leanAngle *= 0.85;

        if (monster.isJumping) {
          monster.jumpY += monster.vy;
          monster.vy += 0.8; // Gravedad
          if (monster.jumpY >= 0) {
            monster.jumpY = 0;
            monster.isJumping = false;
            monster.squishY = 0.7;
            monster.squishX = 1.3;
          }
        }

        if (monster.isSliding) {
          monster.slideTimer--;
          if (monster.slideTimer <= 0) monster.isSliding = false;
        }

        // Deformación elástica suave
        monster.squishX += (1 - monster.squishX) * 0.1;
        monster.squishY += (1 - monster.squishY) * 0.1;
        if (monster.mouthOpen > 0) monster.mouthOpen -= 0.08;

        // Actualizar Objetos en pista
        const speed = cfg.speed * 0.01;

        // Notas
        for (let i = notes.length - 1; i >= 0; i--) {
          let n = notes[i];
          n.z -= speed;

          // Magnetismo si activa powerup
          if (monster.magnet && n.z < 15) {
            n.x += (monster.x - n.x) * 0.15;
          }

          // Colisión con el Monstruo
          if (n.z <= monster.z + 0.5 && n.z >= monster.z - 0.5) {
            if (Math.abs(n.x - monster.x) < 0.8 && Math.abs(monster.jumpY - n.y) < 1.2) {
              eatNote(n);
              notes.splice(i, 1);
              continue;
            }
          }
          if (n.z < 0) notes.splice(i, 1);
        }

        // Obstáculos
        for (let i = obstacles.length - 1; i >= 0; i--) {
          let obs = obstacles[i];
          obs.z -= speed;

          if (obs.z <= monster.z + 0.4 && obs.z >= monster.z - 0.4) {
            if (Math.abs(obs.x - monster.x) < 0.7) {
              let hit = false;
              if (obs.type === 'HIGH' && !monster.isSliding) hit = true;
              if (obs.type === 'LOW' && monster.jumpY > -1) hit = true;

              if (hit) {
                if (monster.shield) {
                  monster.shield = false;
                  createExplosion(monster.x, monster.jumpY, '#3b82f6');
                } else {
                  hitObstacle();
                }
                obstacles.splice(i, 1);
                continue;
              }
            }
          }
          if (obs.z < 0) obstacles.splice(i, 1);
        }

        // Modo Furia
        if (isFrenzy) {
          frenzyTimer--;
          if (frenzyTimer <= 0) {
            isFrenzy = false;
          }
        }
      }

      render(bass || 0);
      requestAnimationFrame(update);
    }

    function spawnBeatElement() {
      const lane = Math.floor(Math.random() * 3);
      const rand = Math.random();

      if (rand < 0.75) {
        // Crear Nota Musical
        notes.push({
          x: LNS[lane],
          y: 0,
          z: 40,
          color: isFrenzy ? '#ec4899' : (Math.random() > 0.5 ? '#a855f7' : '#06b6d4')
        });
      } else {
        // Crear Obstáculo
        const isHigh = Math.random() > 0.5;
        obstacles.push({
          x: LNS[lane],
          z: 40,
          type: isHigh ? 'HIGH' : 'LOW'
        });
      }
    }

    function eatNote(note) {
      combo++;
      monster.mouthOpen = 1.0;
      score += 100 * (isFrenzy ? 2 : 1) * Math.min(combo, 5);
      
      if (!isFrenzy) {
        frenzyMeter = Math.min(100, frenzyMeter + 5);
        if (frenzyMeter >= 100) {
          isFrenzy = true;
          frenzyTimer = 300;
          frenzyMeter = 0;
        }
      }

      createExplosion(note.x, note.y, note.color);
      updateScoreUI();
    }

    function hitObstacle() {
      combo = 0;
      frenzyMeter = 0;
      monster.squishX = 1.6;
      monster.squishY = 0.4;
      createExplosion(monster.x, monster.jumpY, '#ef4444');
      updateScoreUI();
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x, y: y, z: monster.z,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          vz: (Math.random() - 0.5) * 0.2,
          color: color,
          life: 1.0
        });
      }
    }

    function updateScoreUI() {
      document.getElementById('scoreDisplay').innerText = score;
      const comboDisp = document.getElementById('comboDisplay');
      if (combo > 1) {
        comboDisp.innerText = combo + "x COMBO!";
        comboDisp.classList.remove('opacity-0');
      } else {
        comboDisp.classList.add('opacity-0');
      }
      document.getElementById('frenzyBar').style.width = (isFrenzy ? (frenzyTimer/300)*100 : frenzyMeter) + '%';
    }

    // --- RENDERING Y PERSPECTIVA ---
    function project(x, y, z) {
      const fov = 350;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 + 100;
      const scale = fov / (fov + z * 20);
      return {
        px: cx + x * 120 * scale,
        py: cy + (y - 40) * scale,
        scale: scale
      };
    }

    function render(bass) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fondo Synthwave
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#0a0518');
      grad.addColorStop(0.5, '#1e0b36');
      grad.addColorStop(1, '#050508');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dibujar Carriles y Malla 3D
      ctx.strokeStyle = isFrenzy ? 'rgba(236, 72, 153, 0.6)' : 'rgba(168, 85, 247, 0.3)';
      ctx.lineWidth = 2;
      
      for (let i = 0; i < LNS.length; i++) {
        const p1 = project(LNS[i], 0, 0);
        const p2 = project(LNS[i], 0, 50);
        ctx.beginPath();
        ctx.moveTo(p1.px, p1.py);
        ctx.lineTo(p2.px, p2.py);
        ctx.stroke();
      }

      // Dibujar Notas
      notes.forEach(n => {
        const p = project(n.x, n.y, n.z);
        ctx.fillStyle = n.color;
        ctx.shadowColor = n.color;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(p.px, p.py, 16 * p.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Dibujar Obstáculos
      obstacles.forEach(obs => {
        const p = project(obs.x, obs.type === 'HIGH' ? -40 : 0, obs.z);
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 10;
        const w = 80 * p.scale;
        const h = (obs.type === 'HIGH' ? 60 : 30) * p.scale;
        ctx.fillRect(p.px - w/2, p.py - h, w, h);
        ctx.shadowBlur = 0;
      });

      // Dibujar Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy; pt.z += pt.vz;
        pt.life -= 0.03;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        const p = project(pt.x, pt.y, pt.z);
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(p.px, p.py, 6 * p.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      // DIBUJAR AL MONSTRUO (PERSONAJE PRINCIPAL)
      const mp = project(monster.x, monster.jumpY, monster.z);
      const pulse = 1 + (bass / 255) * 0.15; // Pulso con el ritmo de la música
      const radius = 42 * mp.scale * pulse * monster.squishX;

      ctx.save();
      ctx.translate(mp.px, mp.py);
      ctx.rotate(monster.leanAngle);

      // Aura Modo Furia
      if (isFrenzy) {
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 30;
      }

      // Cuerpo negro circular
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();

      // Ojos Circulares Blancos
      const eyeOffset = radius * 0.4;
      const eyeRadius = radius * 0.28;
      ctx.fillStyle = '#ffffff';
      
      // Ojo Izquierdo
      ctx.beginPath();
      ctx.arc(-eyeOffset, -eyeOffset * 0.5, eyeRadius, 0, Math.PI * 2);
      ctx.fill();

      // Ojo Derecho
      ctx.beginPath();
      ctx.arc(eyeOffset, -eyeOffset * 0.5, eyeRadius, 0, Math.PI * 2);
      ctx.fill();

      // Pupilas dirigidas a notas
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(-eyeOffset + 2, -eyeOffset * 0.5 + 2, eyeRadius * 0.4, 0, Math.PI * 2);
      ctx.arc(eyeOffset + 2, -eyeOffset * 0.5 + 2, eyeRadius * 0.4, 0, Math.PI * 2);
      ctx.fill();

      // Boca Roja Abierta con Dientes Zig-Zag Afilados
      ctx.fillStyle = '#991b1b';
      const mouthWidth = radius * 1.3;
      const mouthHeight = radius * (0.3 + monster.mouthOpen * 0.5);

      ctx.beginPath();
      ctx.ellipse(0, radius * 0.2, mouthWidth / 2, mouthHeight / 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dientes afilados
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      const teeth = 6;
      const tWidth = mouthWidth / teeth;
      
      // Dientes superiores
      for (let i = 0; i < teeth; i++) {
        let tx = -mouthWidth/2 + i * tWidth;
        ctx.moveTo(tx, radius * 0.2 - mouthHeight/2);
        ctx.lineTo(tx + tWidth/2, radius * 0.2);
        ctx.lineTo(tx + tWidth, radius * 0.2 - mouthHeight/2);
      }
      // Dientes inferiores
      for (let i = 0; i < teeth; i++) {
        let tx = -mouthWidth/2 + i * tWidth;
        ctx.moveTo(tx, radius * 0.2 + mouthHeight/2);
        ctx.lineTo(tx + tWidth/2, radius * 0.2);
        ctx.lineTo(tx + tWidth, radius * 0.2 + mouthHeight/2);
      }
      ctx.fill();

      ctx.restore();
    }

    // Iniciar bucle de renderizado
    requestAnimationFrame(update);
  </script>
</body>
</html>
